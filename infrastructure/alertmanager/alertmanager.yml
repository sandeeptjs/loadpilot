route:
  receiver: loadpilot
  group_by: [service, environment]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
receivers:
  - name: loadpilot
    webhook_configs:
      - url: http://api:8000/api/alerts
        send_resolved: true
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [service, environment]

