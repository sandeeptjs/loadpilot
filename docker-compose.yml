services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports: ["127.0.0.1:8000:8000"]
    environment:
      LOADPILOT_DB: /app/data/loadpilot.db
      LOADPILOT_GENERATED_DIR: /app/generated-tests
      LOADPILOT_SANDBOX_URL: http://sandbox-target:8080
      LOADPILOT_ALLOWED_HOSTS: sandbox-target
      LOADPILOT_SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:?Set SANDBOX_CONTROL_TOKEN in .env}
      LOADPILOT_ALLOW_SANDBOX_REMEDIATION: ${LOADPILOT_ALLOW_SANDBOX_REMEDIATION:-false}
      LOADPILOT_LLM_BASE_URL: ${LOADPILOT_LLM_BASE_URL:-https://api.openai.com/v1}
      LOADPILOT_LLM_MODEL: ${LOADPILOT_LLM_MODEL:-}
      LOADPILOT_LLM_API_KEY: ${LOADPILOT_LLM_API_KEY:-}
    volumes:
      - generated-tests:/app/generated-tests
      - loadpilot-data:/app/data
    depends_on: [sandbox-target]

  sandbox-target:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.target
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SANDBOX_DB_POOL_SIZE: "2"
      SANDBOX_DB_LATENCY_MS: "80"
      SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:?Set SANDBOX_CONTROL_TOKEN in .env}

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./infrastructure/otel/collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on: [sandbox-target]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  generated-tests:
  loadpilot-data:
  prometheus-data:
