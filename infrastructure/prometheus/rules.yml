groups:
  - name: loadpilot-sandbox
    rules:
      - alert: DatabasePoolSaturation
        expr: sandbox_db_pool_active / sandbox_db_pool_size > 0.9
        for: 20s
        labels:
          service: checkout
          database: sandbox-postgres
          severity: warning
        annotations:
          summary: Checkout database pool is saturated
      - alert: CheckoutLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(sandbox_http_request_duration_seconds_bucket{path="/checkout/{cart_id}"}[1m]))) > 0.5
        for: 20s
        labels:
          service: checkout
          severity: warning
        annotations:
          summary: Checkout p95 exceeds 500 ms

