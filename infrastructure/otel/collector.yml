receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: sandbox-via-otel
          static_configs:
            - targets: ["sandbox-target:8080"]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic
service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]

